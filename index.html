<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paper Review Cards</title>
<style>
:root{--bg:#f7f7f5;--card:#fff;--ink:#1d1d1f;--mute:#6b6b70;--line:#e2e2df;--note:#eef3fb;--noteb:#9db4dc;
--del:#fde2e1;--delink:#a1261d;--ins:#dff3e4;--insink:#1d6b34;--acc:#1f7a3a;--rej:#b3261e;--chg:#a15c00;--btn:#f0f0ee;--you:#fff3d6;--hl:#fff8e1}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#17181a;--card:#202124;--ink:#ececec;--mute:#a0a0a6;--line:#34353a;--note:#1e2a3d;--noteb:#3d5a8a;
--del:#4a2020;--delink:#ffb4ab;--ins:#1d3b26;--insink:#a6e3b8;--acc:#5fd38a;--rej:#ff8a80;--chg:#ffc266;--btn:#2b2c30;--you:#3d3010;--hl:#2e2a1c}}
:root[data-theme="dark"]{--bg:#17181a;--card:#202124;--ink:#ececec;--mute:#a0a0a6;--line:#34353a;--note:#1e2a3d;--noteb:#3d5a8a;
--del:#4a2020;--delink:#ffb4ab;--ins:#1d3b26;--insink:#a6e3b8;--acc:#5fd38a;--rej:#ff8a80;--chg:#ffc266;--btn:#2b2c30;--you:#3d3010;--hl:#2e2a1c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;z-index:2}
header h1{font-size:16px;margin:0 8px 0 0}.pill{font-size:13px;color:var(--mute)}
.bar{flex:1;min-width:120px;height:6px;background:var(--line);border-radius:3px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--acc)}
main{max-width:1000px;margin:0 auto;padding:16px}
.dots{display:flex;flex-wrap:wrap;gap:4px;margin:0 0 14px}
.dot{width:26px;height:22px;border-radius:4px;border:1px solid var(--line);background:var(--card);font-size:11px;color:var(--mute);cursor:pointer;display:grid;place-items:center}
.dot.cur{outline:2px solid var(--ink)}.dot.loc{border-style:dashed;border-color:var(--ink)}
.dot.s-pending{background:#f5c518;color:#3d2f00;border-color:#f5c518}.dot.s-done{background:#1f7a3a;color:#fff;border-color:#1f7a3a}
.dot.s-review,.dot.s-reopened{background:#c62828;color:#fff;border-color:#c62828}.dot.s-skip{background:#8a8a8f;color:#fff;border-color:#8a8a8f}
.sbadge{font-size:11px;padding:2px 7px;border-radius:4px;font-weight:600}.sb-pending{background:#f5c518;color:#3d2f00}.sb-done{background:#1f7a3a;color:#fff}
.sb-skip{background:#8a8a8f;color:#fff}.sb-review,.sb-reopened{background:#c62828;color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
.meta{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;color:var(--mute);font-size:13px;margin-bottom:10px}
.box{border:1px solid var(--line);border-radius:8px;margin:0 0 14px;padding:10px 12px}
.box>b{display:block;font-size:12px;color:var(--mute);font-weight:600;margin-bottom:6px}
.cm{border-left:3px solid var(--noteb);background:var(--note);border-radius:6px;padding:8px 10px;margin:0 0 8px;white-space:pre-wrap;word-break:break-word}
.cm:last-child{margin-bottom:0}
.cm .who{display:flex;gap:8px;align-items:baseline;font:600 11px -apple-system,sans-serif;text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px}
.cm .who span{color:var(--mute);font-weight:500;text-transform:none;letter-spacing:0}
.cm.off{opacity:.6}
.dotc{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--noteb);align-self:center}
.src{font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;word-break:break-word;margin:0}
.src .ctx{color:var(--mute)}.src .th{background:var(--hl);display:block}
.msgs{display:flex;flex-direction:column;gap:8px}
.msg{padding:8px 10px;border-radius:8px;white-space:pre-wrap;max-width:92%}
.msg .who{display:block;font:600 11px -apple-system,sans-serif;color:var(--mute);margin-bottom:3px;text-transform:uppercase;letter-spacing:.04em}
.msg.you{align-self:flex-end;background:var(--you)}.msg.claude{align-self:flex-start;background:var(--note)}
.msg.sys{align-self:flex-end;background:transparent;color:var(--mute);font-size:12px;padding:0 4px}
.chg{border:1px solid var(--line);border-radius:8px;margin:0 0 12px;overflow:hidden}
.chg .h{font-size:12px;color:var(--mute);padding:6px 10px;border-bottom:1px solid var(--line)}
.side{display:grid;grid-template-columns:1fr 1fr}@media(max-width:760px){.side{grid-template-columns:1fr}}
.side>div{padding:10px 12px;font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;word-break:break-word}
.side>div:first-child{border-right:1px solid var(--line)}@media(max-width:760px){.side>div:first-child{border-right:0;border-bottom:1px solid var(--line)}}
.lab{display:block;font:600 11px -apple-system,sans-serif;color:var(--mute);margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em}
del{background:var(--del);color:var(--delink);text-decoration:line-through}ins{background:var(--ins);color:var(--insink);text-decoration:none}
.empty{color:var(--mute);font-style:italic}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;align-items:center}
button,select{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--btn);color:var(--ink);cursor:pointer}
select{padding:7px 8px}
button.a{border-color:var(--acc);color:var(--acc)}button.r{border-color:var(--rej);color:var(--rej)}button.c{border-color:var(--chg);color:var(--chg)}
button.e{border-color:#3f6fd1;color:#3f6fd1}button.p{border-color:#7b4fc9;color:#7b4fc9}button.v{border-color:var(--mute);color:var(--mute)}
button.on.a{background:var(--acc);color:#fff}button.on.r{background:var(--rej);color:#fff}button.on.c{background:var(--chg);color:#fff}
button.on.e{background:#3f6fd1;color:#fff}button.on.p{background:#7b4fc9;color:#fff}button.on.v{background:var(--mute);color:#fff}
button.done{background:#f5c518;border-color:#c9a000;color:#3d2f00;font-weight:600}button.done:disabled{opacity:.4;cursor:not-allowed}
button.skip{margin-left:auto}
textarea{width:100%;min-height:80px;margin-top:10px;font:13px/1.5 ui-monospace,Menlo,monospace;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.edit{display:block;width:100%;min-height:90px;margin:0;border:0;border-top:1px dashed var(--line);border-radius:0;background:var(--bg)}
.hint{font-size:12px;color:var(--mute);margin-top:6px}
.nav{display:flex;justify-content:space-between;margin-top:14px}.kbd{font-size:12px;color:var(--mute)}
.none{color:var(--mute);text-align:center;padding:40px 0}
.badge{font-size:11px;padding:2px 6px;border-radius:4px;background:var(--you);color:var(--chg)}.badge.pr{background:var(--ins);color:var(--insink)}
button.skip{border-color:#8a8a8f;color:#8a8a8f}
</style></head><body>
<header><h1>Paper review cards</h1><span class="pill" id="file"></span><span class="pill" id="count"></span><div class="bar"><i id="prog"></i></div>
<label class="pill"><input type="checkbox" id="showdone"> Show resolved</label></header>
<main><div class="dots" id="dots"></div><div id="card"></div>
<div class="nav"><button id="prev">&larr; Previous</button><span class="kbd">&larr; &rarr; move between cards</span><button id="next">Next &rarr;</button></div></main>
<script>
const KEY='paper-review-cards-v2';
let ALL=[],ITEMS=[],Q=[],META={macros:{}},SV=null,SHOWDONE=false,curId=null;
let D={};try{D=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
let ME='';try{ME=localStorage.getItem(KEY+'-me')||''}catch(e){}
try{curId=localStorage.getItem(KEY+'-cur')}catch(e){}
if(location.hash.length>1)curId=decodeURIComponent(location.hash.slice(1));   // #<card id> opens that card
function save(){try{localStorage.setItem(KEY,JSON.stringify(D));localStorage.setItem(KEY+'-me',ME);if(curId)localStorage.setItem(KEY+'-cur',curId)}catch(e){}}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function fmt(t){if(!t)return '';return new Date(t*1000).toLocaleString([],{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}
function toks(s){return s.match(/\s+|[^\s]+/g)||[]}
function wdiff(a,b){const x=toks(a),y=toks(b),n=x.length,m=y.length;const L=Array.from({length:n+1},()=>new Uint16Array(m+1));
for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)L[i][j]=x[i]===y[j]?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
let i=0,j=0,o='',nn='';while(i<n&&j<m){if(x[i]===y[j]){o+=esc(x[i]);nn+=esc(y[j]);i++;j++}else if(L[i+1][j]>=L[i][j+1]){o+='<del>'+esc(x[i++])+'</del>'}else{nn+='<ins>'+esc(y[j++])+'</ins>'}}
while(i<n)o+='<del>'+esc(x[i++])+'</del>';while(j<m)nn+='<ins>'+esc(y[j++])+'</ins>';return [o,nn]}
const LABEL={pending:'with Claude',done:'resolved',review:'Claude answered: check again',skip:'skipped',reopened:'skipped, but the thread has a new comment'};
function who(m){return (META.macros[m]||{}).label||m}
function colour(m){return (META.macros[m]||{}).color||''}
function view(){ITEMS=(SHOWDONE?ALL:ALL.filter(it=>it.status!=='done')).slice().sort((a,b)=>(!!b.needs_check-!!a.needs_check)||(a.line-b.line));}
function cur(){let k=ITEMS.findIndex(it=>it.id===curId);if(k<0){k=0;curId=ITEMS[0]&&ITEMS[0].id}return k}
function draft(it){const d=D[it.id];if(d&&(d.rev||0)!==(it.rev||0)){delete D[it.id]}return D[it.id]||(D[it.id]={rev:it.rev||0})}

function thread(it){return `<div class="box"><b>Comment thread · ${it.comments.length} comment${it.comments.length>1?'s':''}</b>${it.comments.map(c=>
 `<div class="cm ${c.live?'':'off'}" style="${colour(c.macro)?'border-left-color:'+esc(colour(c.macro)):''}"><div class="who"><i class="dotc" style="${colour(c.macro)?'background:'+esc(colour(c.macro)):''}"></i>${esc(who(c.macro))}<span>\\${esc(c.macro)} · line ${c.line}${c.live?'':' · commented out'}</span></div>${esc(c.text.trim())}</div>`).join('')}</div>`}

function source(it){const n0=it.line-it.before.length;let h='';
 it.before.forEach(l=>h+=`<span class="ctx">${esc(l)}</span>\n`);
 h+=`<span class="th">${it.lines.map(esc).join('\n')}</span>`;
 it.after.forEach(l=>h+=`<span class="ctx">${esc(l)}</span>\n`);
 return `<div class="box"><b>In the paper · lines ${n0}–${it.end_line+it.after.length}</b><pre class="src">${h}</pre></div>`}

function convo(it){const ev=[];
 Q.filter(e=>e.id===it.id).forEach(e=>{const t={change:e.instruction||'(empty message)',reply:`Reply as ${who(e.macro||'')}: ${e.text||''}`,
  accept:'Accepted the changes',reject:'Rejected the changes (revert)',edit:'Sent my own edit',resolve:'Resolve: comment the thread out',keep:'Keep: no change'}[e.decision]||e.decision;
  ev.push({ts:e.ts||0,k:(e.decision==='change'||e.decision==='reply')?'you':'sys',t})});
 (it.replies||[]).forEach(r=>ev.push({ts:r.ts||0,k:'claude',t:r.text}));
 if(!ev.length)return '';ev.sort((a,b)=>a.ts-b.ts);
 return `<div class="box"><b>Conversation with Claude</b><div class="msgs">${ev.map(e=>e.k==='sys'?`<div class="msg sys">${esc(e.t)} · ${fmt(e.ts)}</div>`:
  `<div class="msg ${e.k}"><span class="who">${e.k==='you'?'You':'Claude'} · ${fmt(e.ts)}</span>${esc(e.t)}</div>`).join('')}</div></div>`}

function changes(it,d){if(!it.changes.length)return '';return it.changes.map((c,k)=>{const [o,n]=wdiff(c.old,c.new);
 return `<div class="chg"><div class="h">Claude's change ${k+1} of ${it.changes.length}</div><div class="side">
 <div><span class="lab">Original</span>${o||'<span class="empty">(nothing: new text)</span>'}</div>
 <div><span class="lab">Modified</span>${n||'<span class="empty">(removed)</span>'}</div></div>
 ${d.d==='edit'?`<textarea class="edit" data-k="${k}">${esc((d.e||[])[k]??c.new)}</textarea>`:''}</div>`}).join('')}

const CHECK={plot:'plot change',experiment:'needs an experiment',data:'numbers checked in our data',code:'checked in the code'};
function commented(lines){return lines.map(l=>l.trim()&&!l.trim().startsWith('%')?'% '+l:l)}
function decisionView(it,d){   // a card with no proposal: the thread itself is what the decision changes
 const now=it.lines.join('\n');let after;
 if(d.d==='resolve')after=commented(it.lines).join('\n');else if(d.d==='edit')after=null;else after=now;
 const [o,n]=after===null?[esc(now),'']:wdiff(now,after);
 return `<div class="chg"><div class="h">Your decision on the thread</div><div class="side">
 <div><span class="lab">In the paper now</span>${o}</div>
 <div><span class="lab">After your decision</span>${after===null?'<span class="empty">(your version, below)</span>':(n||'<span class="empty">(removed)</span>')}</div></div>
 ${d.d==='edit'?`<textarea class="edit" data-k="0">${esc((d.e||[])[0]??now)}</textarea>`:''}</div>`}
function render(){view();const box=document.getElementById('card');
 if(!ITEMS.length){box.innerHTML=`<div class="card none">No open comment threads.${ALL.length?' Tick "Show resolved" to see the others.':''}</div>`;dots();return}
 const k=cur(),it=ITEMS[k],d=draft(it),hasC=it.changes.length>0;
 const opts=Object.keys(META.macros).map(m=>`<option value="${esc(m)}" ${m===ME?'selected':''}>${esc(who(m))} (\\${esc(m)})</option>`).join('');
 const B=(cls,dd,label)=>`<button class="${cls} ${d.d===dd?'on':''}" data-d="${dd}">${label}</button>`;
 let h=`<div class="card"><div class="meta"><b style="color:var(--ink)">${k+1} / ${ITEMS.length}</b><span>${esc(it.section||'(before the first section)')}</span><span>line ${it.line}</span>${it.status?`<span class="sbadge sb-${it.status}">${LABEL[it.status]}</span>`:''}${it.needs_check?`<span class="badge">${esc(CHECK[it.needs_check]||it.needs_check)}</span>`:''}${it.drafting?'<span class="sbadge sb-pending">proposal coming</span>':''}${hasC?'<span class="badge pr">Claude proposed a change</span>':''}</div>`;
 h+=thread(it)+convo(it)+source(it)+(hasC?changes(it,d):decisionView(it,d));
 h+=`<div class="actions">${hasC?B('a','accept','Accept')+B('r','reject','Reject (revert)')+B('e','edit','Edit myself')
   :B('a','resolve','Resolve (comment out)')+B('r','keep','Keep (no change)')+B('e','edit','Edit myself')}
 ${B('c','change','Ask Claude…')}${B('p','reply','Reply in the paper…')}
 ${it.status==='skip'||it.status==='reopened'?`<button class="skip" id="unskip">Unskip</button>`:`<button class="skip" id="skip">Skip for now</button>`}</div>
 ${d.d==='change'?`<textarea id="t" placeholder="What should Claude do or answer?">${esc(d.t||'')}</textarea>`:''}
 ${d.d==='reply'?`<div class="actions" style="margin-top:10px"><select id="mac">${opts}</select><span class="hint">adds \\macro{…} under the thread, as your own comment</span></div><textarea id="t" placeholder="Your reply">${esc(d.t||'')}</textarea>`:''}
 <div class="hint">${({accept:'Keeps Claude\'s changes and comments the thread out.',reject:'Puts the original text back and comments the thread out.',
   resolve:'Comments out every live comment of this thread; the paper text is not changed.',keep:'Leaves the paper as it is and closes the card (it comes back if someone adds to the thread).',
   edit:hasC?'Your version replaces Claude\'s text; the thread is then commented out.':'Your version replaces the thread\'s lines (edit the comments, or the text around them).'})[d.d]||''}</div>
 <div class="actions" style="margin-top:12px"><button class="done" id="done" ${d.d?'':'disabled'}>Done &rarr; send to Claude</button></div></div>`;
 box.innerHTML=h;
 box.querySelectorAll('.actions button[data-d]').forEach(b=>b.onclick=()=>{d.d=b.dataset.d;save();render();const t=document.getElementById('t')||document.querySelector('.edit');if(t)t.focus()});
 box.querySelectorAll('.edit').forEach(x=>x.oninput=()=>{d.e=d.e||(hasC?it.changes.map(c=>c.new):[it.lines.join('\n')]);d.e[+x.dataset.k]=x.value;save()});
 const t=document.getElementById('t');if(t)t.oninput=()=>{d.t=t.value;save()};
 const mac=document.getElementById('mac');if(mac){if(!ME)ME=mac.value;mac.onchange=()=>{ME=mac.value;save()}}
 const sk=document.getElementById('skip');if(sk)sk.onclick=()=>post('/api/skip',{id:it.id,sig:it.sig}).then(refresh).then(()=>step(1));
 const us=document.getElementById('unskip');if(us)us.onclick=()=>post('/api/unskip',{id:it.id}).then(refresh);
 document.getElementById('done').onclick=()=>send(it,d);
 dots();save()}

function dots(){const n=ALL.filter(i=>i.status==='done').length,c=s=>ALL.filter(i=>i.status===s).length;
 document.getElementById('count').textContent=`${n} of ${ALL.length} resolved · ${c('pending')} with Claude · ${c('review')+c('reopened')} to re-check · ${c('skip')} skipped`;
 document.getElementById('prog').style.width=(100*n/Math.max(1,ALL.length))+'%';
 const k=ITEMS.findIndex(i=>i.id===curId);
 document.getElementById('dots').innerHTML=ITEMS.map((it,j)=>`<div class="dot ${j===k?'cur':''} ${it.status?'s-'+it.status:((D[it.id]||{}).d?'loc':'')}" data-k="${j}" title="${esc(it.section)} · line ${it.line}">${j+1}</div>`).join('');
 document.querySelectorAll('.dot').forEach(x=>x.onclick=()=>{curId=ITEMS[+x.dataset.k].id;render();scrollTo(0,0)})}
function step(s){const k=cur()+s;if(k>=0&&k<ITEMS.length){curId=ITEMS[k].id;render();scrollTo(0,0)}}
function post(u,b){return fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)})}
async function send(it,d){if(!d.d)return;const b=document.getElementById('done');b.disabled=true;b.textContent='Sending…';
 const body={id:it.id,sig:it.sig,rev:it.rev||0,line:it.line,decision:d.d,instruction:d.d==='change'?(d.t||''):'',
  edits:d.d==='edit'?(it.changes.length?it.changes.map((c,k)=>(d.e||[])[k]??c.new):[(d.e||[])[0]??it.lines.join('\n')]):null,proposed:it.changes.length>0,macro:d.d==='reply'?ME:null,text:d.d==='reply'?(d.t||''):null};
 try{await post('/api/done',body);delete D[it.id];save();
  const nx=ITEMS.findIndex((x,j)=>j>cur()&&!['pending','done','skip'].includes(x.status));if(nx>=0)curId=ITEMS[nx].id;await refresh()}
 catch(e){b.disabled=false;b.textContent='Failed: retry'}}
async function refresh(){try{[ALL,Q]=await Promise.all([fetch('/api/items',{cache:'no-store'}).then(r=>r.json()),fetch('/api/queue',{cache:'no-store'}).then(r=>r.json())])}catch(e){}
 const a=document.activeElement;if(a&&a.tagName==='TEXTAREA'){view();dots()}else render()}
async function poll(){try{const s=await (await fetch('/api/state',{cache:'no-store'})).json();
 if(!SV||s.version!==SV.version||s.tex_mtime!==SV.tex_mtime||s.props_mtime!==SV.props_mtime){SV=s;await refresh()}}catch(e){}}
document.getElementById('prev').onclick=()=>step(-1);document.getElementById('next').onclick=()=>step(1);
document.getElementById('showdone').onchange=e=>{SHOWDONE=e.target.checked;render()};
document.addEventListener('keydown',e=>{if(['TEXTAREA','SELECT','INPUT'].includes(e.target.tagName))return;if(e.key==='ArrowRight')step(1);else if(e.key==='ArrowLeft')step(-1)});
fetch('/api/meta').then(r=>r.json()).then(m=>{META=m;document.getElementById('file').textContent=m.tex;document.title='Review cards · '+m.tex}).finally(()=>{poll();setInterval(poll,2000)});
</script></body></html>
